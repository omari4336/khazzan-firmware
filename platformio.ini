[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra
build_src_filter = +<*> -<serial_test.cpp>

; Explicit selection required; the default remains the ultrasonic firmware.
[env:serial_test]
extends = env:esp32dev
build_src_filter = -<*> +<serial_test.cpp>

[env:ultrasonic_diag]
extends = env:esp32dev
extra_scripts = pre:diagnostics/select_ultrasonic_diag.py
build_src_filter = +<*>

[env:trig_voltage_test]
extends = env:esp32dev
extra_scripts = pre:diagnostics/select_trig_voltage_test.py
build_src_filter = +<*>

[env:ultrasonic_diag_25us]
extends = env:esp32dev
extra_scripts = pre:diagnostics/select_ultrasonic_diag_25us.py
build_src_filter = +<*>

[env:sd_card_test]
extends = env:esp32dev
extra_scripts = pre:diagnostics/select_sd_card_test.py
build_src_filter = +<*>

[env:rtc_test]
extends = env:esp32dev
extra_scripts = pre:diagnostics/select_rtc_test.py
build_src_filter = +<*>
lib_deps = adafruit/RTClib@2.1.4

[env:khazzan_integration_test]
extends = env:esp32dev
extra_scripts = pre:diagnostics/select_khazzan_integration_test.py
build_src_filter = +<*>
lib_deps = adafruit/RTClib@2.1.4
